<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}


/* =================================
   HEADER
================================= */

.topbar {
  height: 60px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 25px;

  background: #ffffff;

  border-bottom: 1px solid #e0e0e0;

  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;

  font-size: 22px;
  font-weight: 700;

  color: #2e7d32;
}

.logo span {
  margin-left: 8px;
}

.counter {
  display: flex;
  align-items: center;

  font-size: 16px;
  font-weight: 600;

  color: #2e7d32;
}

.counter-icon {
  margin-right: 5px;
}

.counter-label {
  margin-left: 5px;
}


/* =================================
   SEARCH
================================= */

.search-area {
  padding: 14px 13px 10px;
}

#search {
  width: 100%;

  height: 48px;

  padding: 0 18px;

  border: 1px solid #d6d6d6;

  border-radius: 10px;

  background: #ffffff;

  font-size: 15px;

  outline: none;
}

#search:focus {
  border-color: #2e7d32;
}


/* =================================
   BOOK GRID
================================= */

#books {

  display: grid;

  grid-template-columns:
    repeat(auto-fill, minmax(220px, 220px));

  gap: 18px;

  justify-content: center;

  padding: 10px 15px 30px;

}


/* =================================
   BOOK CARD
================================= */

.book-card {

  width: 220px;

  height: 450px;

  background: #ffffff;

  border-radius: 12px;

  padding: 14px;

  box-shadow:
    0 2px 8px rgba(0, 0, 0, 0.07);

  display: flex;

  flex-direction: column;

  overflow: hidden;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.book-card:hover {

  transform: translateY(-3px);

  box-shadow:
    0 6px 16px rgba(0, 0, 0, 0.12);

}


/* =================================
   BOOK COVER
================================= */

.book-cover {

  width: 100%;

  height: 280px;

  min-height: 280px;

  object-fit: cover;

  border-radius: 8px;

  display: block;
}


/* =================================
   BOOK TITLE
================================= */

.book-title {

  margin-top: 9px;

  height: 21px;
  min-height: 21px;

  font-size: 17px;
  font-weight: 600;

  line-height: 21px;

  color: #111;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =================================
   AUTHOR
================================= */

.book-author {

  margin-top: 3px;

  height: 18px;
  min-height: 18px;

  line-height: 18px;

  font-size: 14px;

  color: #666;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;

  display: block;

  width: 100%;
}

/* =================================
   CATEGORY + LANGUAGE
================================= */

.book-meta {

  margin-top: 8px;

  height: 28px;

  min-height: 28px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 8px;

  width: 100%;

  overflow: hidden;
}


/* =================================
   CATEGORY
================================= */

.category {

  display: block;

  flex: 1;

  min-width: 0;

  padding: 5px 9px;

  border-radius: 20px;

  background: #e8f5e9;

  color: #2e7d32;

  font-size: 12px;

  line-height: 16px;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =================================
   LANGUAGE
================================= */

.language {

  flex-shrink: 0;

  width: 70px;

  text-align: right;

  font-size: 12px;

  line-height: 16px;

  color: #777;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


/* =================================
   READ BUTTON
================================= */

.read-btn {

  width: 100%;

  height: 40px;

  min-height: 40px;

  margin-top: auto;

  border: none;

  border-radius: 7px;

  background: #2e7d32;

  color: #ffffff;

  font-size: 14px;

  font-weight: 600;

  cursor: pointer;

  transition:
    background 0.2s ease,
    transform 0.1s ease;
}

.read-btn:hover {

  background: #256628;

}

.read-btn:active {

  transform: scale(0.98);

}


/* =================================
   LOADING
================================= */

.loading {

  grid-column: 1 / -1;

  text-align: center;

  padding: 50px;

  color: #777;

  font-size: 15px;
}


/* =================================
   NO BOOKS
================================= */

.no-books {

  grid-column: 1 / -1;

  text-align: center;

  padding: 50px;

  color: #777;
}


/* =================================
   FOOTER
================================= */

footer {

  text-align: center;

  padding: 20px;

  font-size: 12px;

  color: #888;
}


/* =================================
   TABLET
================================= */

@media (max-width: 1000px) {

  #books {

    grid-template-columns:
      repeat(auto-fill, minmax(210px, 210px));

  }

  .book-card {

    width: 210px;

    height: 440px;

  }

  .book-cover {

    height: 270px;

    min-height: 270px;

  }

}


/* =================================
   MOBILE
================================= */

@media (max-width: 600px) {

  .topbar {

    height: 54px;

    padding: 0 15px;

  }

  .logo {

    font-size: 18px;

  }

  .counter {

    font-size: 14px;

  }

  .search-area {

    padding: 10px;

  }

  #books {

    grid-template-columns:
      repeat(2, minmax(0, 1fr));

    gap: 10px;

    padding: 5px 10px 20px;

  }

  .book-card {

    width: 100%;

    height: 390px;

    padding: 9px;

  }

  .book-cover {

    height: 220px;

    min-height: 220px;

  }

  .book-title {

    font-size: 14px;

    height: 18px;

    min-height: 18px;

    line-height: 18px;

  }

  .book-author {

    font-size: 12px;

    height: 16px;

    min-height: 16px;

    line-height: 16px;

  }

  .category {

    font-size: 10px;

    padding: 4px 7px;

  }

  .language {

    width: 60px;

    font-size: 10px;

  }

  .read-btn {

    height: 36px;

    min-height: 36px;

    font-size: 13px;

  }

}

</style>
