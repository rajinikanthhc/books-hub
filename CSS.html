<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

.header{
    position:sticky;
    top:0;
    background:white;
    padding:20px 30px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    z-index:100;
}

.header h1{
    color:#2E7D32;
    font-size:34px;
}

.container{
    padding:25px;
}

#search{
    width:100%;
    padding:14px 18px;
    border-radius:10px;
    border:1px solid #ddd;
    font-size:16px;
    margin-bottom:25px;
}

#books{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
}

.book-card{

    background:white;

    border-radius:15px;

    padding:22px;

    box-shadow:0 4px 12px rgba(0,0,0,.08);

    transition:.25s;

}

.book-card:hover{

    transform:translateY(-5px);

    box-shadow:0 8px 20px rgba(0,0,0,.15);

}

.book-icon{

    font-size:48px;

    text-align:center;

    margin-bottom:15px;

}

.book-title{

    font-size:22px;

    font-weight:bold;

    margin-bottom:8px;

}

.author{

    color:#666;

    margin-bottom:10px;

}

.category{

    display:inline-block;

    background:#E8F5E9;

    color:#2E7D32;

    padding:5px 10px;

    border-radius:20px;

    font-size:13px;

    margin-bottom:15px;

}

.language{

    float:right;

    color:#999;

    font-size:13px;

}

.read-btn{

    width:100%;

    padding:12px;

    border:none;

    border-radius:8px;

    background:#2E7D32;

    color:white;

    font-size:15px;

    cursor:pointer;

}

.read-btn:hover{

    background:#1B5E20;

}

</style>
