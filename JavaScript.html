<script>

let books = [];


/* =================================
   LOAD BOOKS
================================= */

window.onload = function () {

  google.script.run
    .withSuccessHandler(showBooks)
    .getBooks();

};


/* =================================
   DISPLAY BOOKS
================================= */

function showBooks(data) {

  books = data;

  document.getElementById("totalBooks").innerHTML = data.length;

  renderBooks(books);

}


/* =================================
   RENDER BOOKS
================================= */

function renderBooks(list) {

  let html = "";

  list.forEach(book => {

    html += `

      <div class="book-card">

        <!-- BOOK COVER -->

        <img
          src="${book.cover}"
          class="book-cover"
          alt="${book.title}"
          onerror="this.src='https://raw.githubusercontent.com/rajinikanthhc/images/main/Book%20Covers/default-book.png'"
        >


        <!-- TITLE -->

        <div class="book-title">
          ${book.title}
        </div>


        <!-- AUTHOR -->

        <div class="book-author">
          ${book.author}
        </div>


        <!-- CATEGORY + LANGUAGE -->

        <div class="book-meta">

          <span class="category">
            ${book.category}
          </span>

          <span class="language">
            ${book.language == "English"
              ? "🇬🇧 English"
              : "🇮🇳 Kannada"}
          </span>

        </div>


        <!-- READ BUTTON -->

        <button
          class="read-btn"
          onclick="window.open('${book.pdf}', '_blank')">

          📖 Read

        </button>

      </div>

    `;

  });

  document.getElementById("books").innerHTML = html;

}


/* =================================
   SEARCH
================================= */

function searchBooks() {

  const text = document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();


  const filtered = books.filter(book =>

    book.title.toLowerCase().includes(text) ||

    book.author.toLowerCase().includes(text) ||

    book.category.toLowerCase().includes(text)

  );


  renderBooks(filtered);

}

</script>
